name: Build GMLoader-Next for armhf

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Dependencies
      run: |
        # 1. 开启 armhf 架构支持
        sudo dpkg --add-architecture armhf
        sudo apt-get update
        
        # 2. 安装交叉编译工具链、LLVM、Python 绑定
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
          libc6-dev-armhf-cross libstdc++-11-dev-armhf-cross \
          llvm-11 libclang-11-dev python3-clang-11 \
          pkg-config
        
        # 3. 关键：安装 ARM 架构的 SDL2 开发库，而非宿主机版本
        sudo apt-get install -y libsdl2-dev:armhf
        
        # 4. 创建 pkg-config 软链接，确保交叉编译能找到正确的库
        sudo ln -sf /usr/bin/pkg-config /usr/bin/arm-linux-gnueabihf-pkg-config
        echo "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

    - name: Build GMLoader-Next
      run: |
        make -f Makefile.gmloader \
          ARCH=arm-linux-gnueabihf \
          LLVM_FILE=/usr/lib/llvm-11/lib/libclang-11.so.1 \
          LLVM_INC="/usr/arm-linux-gnueabihf/include /usr/arm-linux-gnueabihf/include/c++/11 /usr/arm-linux-gnueabihf/include/c++/11/arm-linux-gnueabihf" \
          -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gmloadernext-armhf
        path: ./gmloadernext.armhf
