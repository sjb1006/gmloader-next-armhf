name: Build GMLoader-Next for armhf

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install Dependencies
      run: |
        # 1. 开启 armhf 架构支持
        sudo dpkg --add-architecture armhf

        # 2. 彻底删除系统原有的源
        sudo rm -f /etc/apt/sources.list
        sudo rm -f /etc/apt/sources.list.d/*.list
        sudo rm -f /etc/apt/sources.list.d/*.sources

        # 3. 写入纯净的 amd64 源
        sudo tee /etc/apt/sources.list.d/amd64.list <<EOF
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
        EOF

        # 4. 写入纯净的 armhf 源
        sudo tee /etc/apt/sources.list.d/armhf.list <<EOF
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
        EOF

        # 5. 更新并安装
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
          libc6-dev-armhf-cross libstdc++-11-dev-armhf-cross \
          llvm-11 libclang-11-dev python3-clang-11 \
          pkg-config \
          libsdl2-dev:armhf
        
        # 6. 配置 pkg-config
        sudo ln -sf /usr/bin/pkg-config /usr/bin/arm-linux-gnueabihf-pkg-config
        echo "PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

    - name: Build GMLoader-Next
      run: |
        # --- 关键修复开始 ---
        echo "=== 检查并生成 zipconf.h ==="
        ZIPCONF_PATH="3rdparty/libzip-config/zipconf.h"
        if [ ! -f "$ZIPCONF_PATH" ]; then
          echo "zipconf.h 未找到，正在从 zipconf.h.in 生成..."
          # 查找源文件 zipconf.h.in
          if [ -f "3rdparty/libzip/zipconf.h.in" ]; then
            # 复制并替换其中的 CMake 变量占位符（模拟 configure 过程）
            sed -e 's/#cmakedefine HAVE_INT8_T_LIBZIP/#define HAVE_INT8_T_LIBZIP/' \
                -e 's/#cmakedefine HAVE_UINT8_T_LIBZIP/#define HAVE_UINT8_T_LIBZIP/' \
                -e 's/#cmakedefine HAVE_INT16_T_LIBZIP/#define HAVE_INT16_T_LIBZIP/' \
                -e 's/#cmakedefine HAVE_UINT16_T_LIBZIP/#define HAVE_UINT16_T_LIBZIP/' \
                -e 's/#cmakedefine HAVE_INT32_T_LIBZIP/#define HAVE_INT32_T_LIBZIP/' \
                -e 's/#cmakedefine HAVE_UINT32_T_LIBZIP/#define HAVE_UINT32_T_LIBZIP/' \
                -e 's/#cmakedefine HAVE_INT64_T_LIBZIP/#define HAVE_INT64_T_LIBZIP/' \
                -e 's/#cmakedefine HAVE_UINT64_T_LIBZIP/#define HAVE_UINT64_T_LIBZIP/' \
                -e 's/#cmakedefine HAVE_SSIZE_T_LIBZIP/#define HAVE_SSIZE_T_LIBZIP/' \
                "3rdparty/libzip/zipconf.h.in" > "$ZIPCONF_PATH"
            echo "已生成 $ZIPCONF_PATH"
          else
            echo "错误：未找到 zipconf.h.in，无法自动生成 zipconf.h"
            exit 1
          fi
        else
          echo "zipconf.h 已存在。"
        fi
        # --- 关键修复结束 ---

        # 设置包含路径，优先级从高到低
        export CPATH="$PWD/3rdparty/libzip-config:$PWD/3rdparty/libzip/lib:$PWD/3rdparty/libbsd-config:$PWD/3rdparty/libbsd/include:$CPATH"
        
        # 清理可能存在的旧构建缓存，强制重新编译
        rm -rf build/arm-linux-gnueabihf/
        
        make -f Makefile.gmloader \
          ARCH=arm-linux-gnueabihf \
          LLVM_FILE=/usr/lib/llvm-11/lib/libclang-11.so.1 \
          LLVM_INC="/usr/arm-linux-gnueabihf/include /usr/arm-linux-gnueabihf/include/c++/11 /usr/arm-linux-gnueabihf/include/c++/11/arm-linux-gnueabihf" \
          -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gmloadernext-armhf
        path: ./gmloadernext.armhf
