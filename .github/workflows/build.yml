name: Build GMLoader-Next for armhf

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Sources and Install Dependencies
      run: |
        # 1. 开启架构支持，配置纯净源
        sudo dpkg --add-architecture armhf
        sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
        sudo tee /etc/apt/sources.list <<EOF
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
        deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
        EOF

        # 2. 安装交叉编译器、LLVM 以及 ARM 版 SDL2
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
          libc6-dev-armhf-cross libstdc++-11-dev-armhf-cross \
          llvm-11 libclang-11-dev python3-clang-11 \
          pkg-config libsdl2-dev:armhf
          
        # 建立 pkg-config 链接
        sudo ln -sf /usr/bin/pkg-config /usr/bin/arm-linux-gnueabihf-pkg-config

    - name: Fix zipconf.h manually
      run: |
        # 3. 直接手写一份干净的 zipconf.h，彻底解决类型未定义报错
        # （原仓库里的 zipconf.h 是个残缺的模板，缺少标准 typedef）
        cat << 'EOF' > 3rdparty/libzip-config/zipconf.h
        #ifndef _HAD_ZIPCONF_H
        #define _HAD_ZIPCONF_H
        #include <stdint.h>
        #include <sys/types.h>
        #define ZIP_INT8_MAX 127
        #define ZIP_INT8_MIN -128
        #define ZIP_UINT8_MAX 255
        #define ZIP_INT16_MAX 32767
        #define ZIP_INT16_MIN -32768
        #define ZIP_UINT16_MAX 65535
        #define ZIP_INT32_MAX 2147483647
        #define ZIP_INT32_MIN -2147483648
        #define ZIP_UINT32_MAX 4294967295U
        typedef int8_t zip_int8_t;
        typedef uint8_t zip_uint8_t;
        typedef int16_t zip_int16_t;
        typedef uint16_t zip_uint16_t;
        typedef int32_t zip_int32_t;
        typedef uint32_t zip_uint32_t;
        typedef int64_t zip_int64_t;
        typedef uint64_t zip_uint64_t;
        #define ZIP_INT64_MAX 9223372036854775807LL
        #define ZIP_INT64_MIN (-9223372036854775807LL - 1)
        #define ZIP_UINT64_MAX 18446744073709551615ULL
        #endif
        EOF

    - name: Build GMLoader-Next
      run: |
        # 4. 清理旧缓存，直接使用 Makefile 构建
        rm -rf build/arm-linux-gnueabihf/
        
        make -f Makefile.gmloader \
          ARCH=arm-linux-gnueabihf \
          LLVM_FILE=/usr/lib/llvm-11/lib/libclang-11.so.1 \
          LLVM_INC="/usr/arm-linux-gnueabihf/include /usr/arm-linux-gnueabihf/include/c++/11 /usr/arm-linux-gnueabihf/include/c++/11/arm-linux-gnueabihf" \
          -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gmloadernext-armhf
        path: ./gmloadernext.armhf
